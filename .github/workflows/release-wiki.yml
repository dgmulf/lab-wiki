name: Release wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-wiki
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Typst website
        run: ./scripts/wiki build

      - name: Save website for Pages deployment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-site
          path: _site/
          if-no-files-found: error
          retention-days: 7

      - name: Package rendered wiki
        run: |
          mkdir -p _release
          printf '%s\n' "$GITHUB_SHA" > _site/COMMIT.txt
          tar -czf _release/lab-wiki-html.tar.gz -C _site .

      - name: Update continuous release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > _release/notes.md <<EOF
          Typst HTML website from commit $GITHUB_SHA.

          Download and extract lab-wiki-html.tar.gz, then start at index.html.
          This rolling prerelease is updated on every push to main.
          EOF
          if gh release view continuous > /dev/null 2>&1; then
            gh release upload continuous _release/lab-wiki-html.tar.gz --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/continuous" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit continuous --title 'Continuous wiki build' \
              --prerelease --notes-file _release/notes.md
          else
            gh release create continuous _release/lab-wiki-html.tar.gz \
              --target "$GITHUB_SHA" --title 'Continuous wiki build' \
              --prerelease --latest=false --notes-file _release/notes.md
          fi
