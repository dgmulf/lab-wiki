user www-data;
worker_processes auto;
pid /run/wiki-nginx.pid;
error_log /var/log/nginx/wiki-error.log;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/wiki-access.log;
    sendfile on;
    server_tokens off;
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /srv/wiki/www/current;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        # Only the exe.dev proxy may supply this identity. Keep the VM private
        # and do not expose port 8080 directly to untrusted networks.
        location ^~ /source.git/ {
            if ($http_x_exedev_userid = "") { return 403; }
            client_max_body_size 100m;
            fastcgi_read_timeout 300s;
            fastcgi_pass unix:/run/wiki-git.socket;
            # Explicit CGI parameters: never forward credentials or arbitrary
            # request headers to the backend (or to receive hooks).
            fastcgi_pass_request_headers off;
            fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
            fastcgi_param GIT_PROJECT_ROOT /srv/wiki;
            fastcgi_param PATH_INFO $uri;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_USER $http_x_exedev_userid;
            fastcgi_param GIT_PROTOCOL $http_git_protocol;
        }
        location = /source.git { return 404; }
        location ~ /\. { deny all; }
        location / { try_files $uri $uri/ =404; }
    }
}
